name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

# Publishing is off, so a tag only proves the tree builds and the three version
# files agree. Nothing is uploaded while the installer is unsigned: Defender has
# false-positived on it once (Trojan:Win32/WacatacH!ml). Releases are cut by hand
# from a local `npm run pack` until that is sorted out.
env:
  PUBLISH: 'false'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      # The two translation tables drift silently: a key added to one language
      # and forgotten in the other shows the raw key to the user.
      - name: Check the translations
        run: npm run check:i18n

      # Every unit test in the crate: the island's anchoring arithmetic, the shell
      # and the tool-call parser. They only run here — on a machine with the GNU
      # toolchain the test binary refuses to start (STATUS_ENTRYPOINT_NOT_FOUND),
      # which is why the same tests were checked by hand locally.
      - name: Run the Rust tests
        run: cargo test --lib --quiet

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (run by tauri as beforeBuildCommand) compiles the front
      # end; `pack` then copies the installer out of target/ under its shipping
      # name.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      # Upload only on a manual run. The repo is public, so artifacts are
      # downloadable by any signed-in GitHub user; retention-days: 3 limits how
      # long they sit there.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Oczi-Windows-setup
          path: windows/release/Oczi-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 3

      - name: Publish the release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $notes = @"
          Oczi for Windows $v — Iskra at the top of your screen.

          ## Setup

          1. Download ``Oczi-Windows-$v-setup.exe`` and run it. The installer is not
             code-signed yet, so Windows SmartScreen shows a warning: click
             **More info → Run anyway**. It installs for the current user only — no
             admin prompt. Defender has also false-positived on it once
             (``Trojan:Win32/WacatacH!ml``, reported to Microsoft); building from
             source gives the same app with none of that.
          2. Launch Oczi. The island sits at the top of your screen; ``Ctrl+Alt+M``
             summons it, ``Esc`` dismisses it.
          3. Open **Settings → DeepSeek**, paste your API key and pick a model
             (``deepseek-flash`` or ``deepseek-v4-pro``). The key is stored in the
             Windows Credential Manager, never on disk and never sent to the web view.
          "@
          gh release create "${{ github.ref_name }}" `
            "release/Oczi-Windows-$v-setup.exe" `
            --title "Oczi for Windows $v" `
            --notes $notes

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The tag has to follow the release, or windows-latest keeps pointing
            # at the first commit it was ever created from.
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "Oczi for Windows (latest)" --notes "Always the newest Windows build — currently $v."
            gh release upload windows-latest "release/Oczi-Windows-setup.exe" --clobber
          } else {
            gh release create windows-latest `
              "release/Oczi-Windows-setup.exe" `
              --title "Oczi for Windows (latest)" `
              --notes "Always the newest Windows build — currently $v."
          }
