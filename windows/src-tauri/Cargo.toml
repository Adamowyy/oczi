[package]
name = "oczi"
description = "Oczi — Iskra lives at the top of your screen"
authors = ["Adam Warzecha"]
license = "MIT"
repository = "https://github.com/Adamowyy/oczi"
version.workspace = true
edition.workspace = true

[lib]
name = "oczi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
# Only for encoding the region screenshot the user snips; already in the tree as a
# transitive dependency, so this adds no download.
png = "0.17"
# Direct dependency so the `#[implement(IDropTarget)]` macro can reach `windows_core`;
# must match the version `windows` itself pins.
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The crash guard hooks WebView2's ProcessFailed event, and Tauri hands the
# controller over as a `webview2-com` interface — so the listener is written
# against that same binding.
webview2-com = "0.39"
# …which is built on the 0.62 line of windows-core, while the app links the 0.61
# line above; to cargo those are two different crates. The guard needs the 0.62
# `Interface` trait (to query the richer ProcessFailed args) and its `PWSTR`.
windows-core-062 = { package = "windows-core", version = "0.62" }
