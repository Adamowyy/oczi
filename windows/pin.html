<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pin — Oczi</title>
    <style>
      /* Self-contained like the snip overlay: this page never loads the island's stylesheet, so
         nothing done for the island can break a pin. When no menu is open the window is cut to the
         crop, so the picture fills it exactly. */
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font: 500 12px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.94);
        border-radius: 6px;
      }
      #pin-shot {
        display: block;
        width: 100%;
        height: 100%;
        cursor: move;
        /* Soft corners, always: the window is transparent, so rounding the picture is what makes a
           pin read as a card stuck on the screen rather than a hole cut in it. */
        border-radius: 6px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      #pin-shot[hidden] {
        display: none;
      }
      /* The marks, drawn in the picture's own pixel grid so a zoom keeps them where they were put. */
      #pin-ink {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 6px;
        cursor: crosshair;
      }
      /* The three corner buttons: tools, keep-above, close. They only appear while the pin is being
         handled. */
      #pin-close,
      #pin-keep,
      #pin-tools-toggle {
        position: absolute;
        top: 5px;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(10, 11, 14, 0.72);
        color: rgba(255, 255, 255, 0.9);
        font: 500 13px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.12s ease-out;
      }
      #pin-close {
        right: 5px;
      }
      #pin-keep {
        right: 29px;
      }
      #pin-tools-toggle {
        right: 53px;
      }
      body:hover #pin-close,
      body:hover #pin-keep,
      body:hover #pin-tools-toggle,
      body.tooling #pin-tools-toggle {
        opacity: 1;
      }
      /* Faded means "an ordinary window": the pin is still there, just not above everything. */
      #pin-keep.off {
        color: rgba(255, 255, 255, 0.4);
      }
      #pin-tools-toggle.on {
        background: rgba(123, 224, 255, 0.3);
        color: #d6f2ff;
      }
      body.menu #pin-close,
      body.menu #pin-keep,
      body.menu #pin-tools-toggle {
        display: none;
      }
      #pin-close:hover {
        background: rgba(214, 62, 78, 0.9);
      }
      #pin-tools-toggle:hover,
      #pin-keep:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      /* The tools are a popup under their own button, not a strip across the picture: a pin is a
         reference, and chrome over it costs the pixels it was pinned for. */
      #pin-tools {
        position: absolute;
        top: 30px;
        right: 5px;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 3px;
        max-width: calc(100% - 10px);
        padding: 4px;
        border-radius: 12px;
        background: rgba(12, 13, 17, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        cursor: default;
      }
      #pin-tools[hidden] {
        display: none;
      }
      #pin-tools button {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
      }
      #pin-tools button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      #pin-tools button.on {
        background: rgba(123, 224, 255, 0.26);
        color: #d6f2ff;
      }
      /* A swatch is a filled circle: the colour it paints, with a ring so a white one is still a
         circle and not a hole. */
      #pin-tools .swatch {
        width: 18px;
        height: 18px;
        padding: 0;
        margin: 0 1px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
      }
      #pin-tools .swatch span {
        display: block;
        width: 14px;
        height: 14px;
        margin: 2px auto;
        border-radius: 50%;
      }
      /* The colours come from these rules, not from style attributes on the spans: the window's CSP
         lets a stylesheet through but not an inline style, and an attribute-styled dot stays empty. */
      #pin-tools .swatch[data-color="#f4505e"] span {
        background: #f4505e;
      }
      #pin-tools .swatch[data-color="#ffb020"] span {
        background: #ffb020;
      }
      #pin-tools .swatch[data-color="#35d07f"] span {
        background: #35d07f;
      }
      #pin-tools .swatch[data-color="#7be0ff"] span {
        background: #7be0ff;
      }
      #pin-tools .swatch[data-color="#ffffff"] span {
        background: #ffffff;
      }
      #pin-tools .swatch.on {
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), inset 0 0 0 1px rgba(0, 0, 0, 0.4);
      }
      #pin-tools .divider {
        width: 1px;
        height: 14px;
        margin: 0 2px;
        background: rgba(255, 255, 255, 0.16);
      }
      /* The caption field sits where the click landed. Fixed, so a field that reaches the edge of a
         small pin cannot scroll the document and shift the picture under it. */
      #pin-text-input {
        position: fixed;
        -webkit-appearance: none;
        z-index: 4;
        min-width: 70px;
        max-width: calc(100% - 12px);
        padding: 3px 6px;
        border: 1px solid rgba(123, 224, 255, 0.85);
        border-radius: 6px;
        background: rgba(10, 11, 14, 0.92);
        color: inherit;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-weight: 600;
        outline: none;
      }
      #pin-text-input[hidden] {
        display: none;
      }
      #pin-menu {
        position: absolute;
        z-index: 5;
        min-width: 168px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(14, 15, 19, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #pin-menu[hidden] {
        display: none;
      }
      #pin-menu button {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        height: 22px;
        line-height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pin-menu button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      #pin-menu .sep {
        height: 1px;
        margin: 3px 6px;
        background: rgba(255, 255, 255, 0.1);
      }
      #pin-opacity {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 8px;
        font-size: 11px;
      }
      #pin-opacity span {
        margin-right: auto;
        color: rgba(255, 255, 255, 0.6);
        cursor: default;
      }
      #pin-opacity button {
        padding: 0 6px;
        height: 18px;
        line-height: 18px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 11px;
        text-align: center;
      }
      #pin-opacity button.on {
        background: rgba(123, 224, 255, 0.22);
        color: #cfefff;
      }
      #pin-toast {
        position: absolute;
        z-index: 6;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(10, 11, 14, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.12);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.15s ease-out;
        pointer-events: none;
      }
      #pin-toast.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <img id="pin-shot" alt="" draggable="false" hidden />
    <canvas id="pin-ink"></canvas>
    <button id="pin-tools-toggle" aria-label="Tools">✎</button>
    <button id="pin-keep" aria-label="Always on top">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true">
        <path
          d="M15.2 2.3 21.7 8.8l-2.5.6-3.3 3.3.4 3.6-1.9 1.9-3.5-3.5-4.3 4.3-1.3-1.3 4.3-4.3L6 9.9l1.9-1.9 3.6.4 3.3-3.3.4-2.8Z"
        />
      </svg>
    </button>
    <button id="pin-close" aria-label="Close">×</button>
    <div id="pin-tools" hidden>
      <button data-tool="move">✥</button>
      <button data-tool="pen">✎</button>
      <button data-tool="text">T</button>
      <div class="divider"></div>
      <button class="swatch on" data-color="#f4505e"><span></span></button>
      <button class="swatch" data-color="#ffb020"><span></span></button>
      <button class="swatch" data-color="#35d07f"><span></span></button>
      <button class="swatch" data-color="#7be0ff"><span></span></button>
      <button class="swatch" data-color="#ffffff"><span></span></button>
      <div class="divider"></div>
      <button data-action="undo">↶</button>
      <button data-action="clear">⌫</button>
    </div>
    <!-- No autocomplete and no spellcheck: the arrow keys resize the caption, and a suggestion
         list would swallow them and rewrite the words instead. -->
    <input
      id="pin-text-input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
      hidden
    />
    <div id="pin-menu" hidden>
      <button data-action="ask"></button>
      <button data-action="copy-text"></button>
      <button data-action="copy-image"></button>
      <button data-action="save"></button>
      <div class="sep"></div>
      <div id="pin-opacity">
        <span></span>
        <button data-opacity="100">100</button>
        <button data-opacity="75">75</button>
        <button data-opacity="50">50</button>
        <button data-opacity="25">25</button>
      </div>
      <div class="sep"></div>
      <button data-action="close"></button>
      <button data-action="close-all"></button>
    </div>
    <div id="pin-toast"></div>
    <script type="module" src="/src/pin.ts"></script>
  </body>
</html>
