<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pin — Oczi</title>
    <style>
      /* Self-contained like the snip overlay: this page never loads the island's stylesheet,
         so nothing done for the island can break a pin. When no menu is open the window is cut to
         the crop, so the picture fills it exactly — no padding, no scrolling, no layout to get
         wrong. */
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font: 500 12px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.94);
        border-radius: 6px;
      }
      #pin-shot {
        display: block;
        width: 100%;
        height: 100%;
        cursor: move;
        /* Soft corners, always: the window is transparent, so rounding the picture is what makes a
           pin read as a card stuck on the screen rather than a hole cut in it. The hairline is drawn
           inside the picture so it never eats layout or gets clipped. */
        border-radius: 6px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 10px 30px rgba(0, 0, 0, 0.45);
      }
      #pin-shot[hidden] {
        display: none;
      }
      #pin-close {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(10, 11, 14, 0.72);
        color: rgba(255, 255, 255, 0.9);
        font: 500 13px/1 -apple-system, "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.12s ease-out;
      }
      body:hover #pin-close {
        opacity: 1;
      }
      /* While a menu is open the window is bigger than the picture, and the × would be sitting in
         the empty strip beside it — the menu has its own Close, so this one steps aside. */
      body.menu #pin-close {
        display: none;
      }
      #pin-close:hover {
        background: rgba(214, 62, 78, 0.9);
      }
      #pin-keep {
        position: absolute;
        top: 5px;
        right: 29px;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(10, 11, 14, 0.72);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.12s ease-out;
      }
      body:hover #pin-keep {
        opacity: 1;
      }
      /* Faded means "an ordinary window": the pin is still there, just not above everything. */
      #pin-keep.off {
        color: rgba(255, 255, 255, 0.4);
      }
      body.menu #pin-keep {
        display: none;
      }
      /* The menu is drawn inside the pinned window itself: a native popup would steal focus and
         sit outside the crop, and a pin has to stay exactly what it is — a picture. */
      #pin-menu {
        position: absolute;
        min-width: 168px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(14, 15, 19, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      #pin-menu[hidden] {
        display: none;
      }
      #pin-menu button {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        height: 22px;
        line-height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pin-menu button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      #pin-menu .sep {
        height: 1px;
        margin: 3px 6px;
        background: rgba(255, 255, 255, 0.1);
      }
      #pin-opacity {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 0 8px;
        font-size: 11px;
      }
      #pin-opacity span {
        margin-right: auto;
        color: rgba(255, 255, 255, 0.6);
        cursor: default;
      }
      #pin-opacity button {
        padding: 0 6px;
        height: 18px;
        line-height: 18px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 11px;
        text-align: center;
      }
      #pin-opacity button.on {
        background: rgba(123, 224, 255, 0.22);
        color: #cfefff;
      }
      #pin-toast {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        max-width: calc(100% - 16px);
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(10, 11, 14, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.12);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.15s ease-out;
        pointer-events: none;
      }
      #pin-toast.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <img id="pin-shot" alt="" draggable="false" hidden />
    <button id="pin-keep" aria-label="Always on top">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true">
        <path
          d="M15.2 2.3 21.7 8.8l-2.5.6-3.3 3.3.4 3.6-1.9 1.9-3.5-3.5-4.3 4.3-1.3-1.3 4.3-4.3L6 9.9l1.9-1.9 3.6.4 3.3-3.3.4-2.8Z"
        />
      </svg>
    </button>
    <button id="pin-close" title="Close" aria-label="Close">×</button>
    <div id="pin-menu" hidden>
      <button data-action="ask"></button>
      <button data-action="copy-text"></button>
      <button data-action="copy-image"></button>
      <button data-action="save"></button>
      <div class="sep"></div>
      <div id="pin-opacity">
        <span></span>
        <button data-opacity="100">100</button>
        <button data-opacity="75">75</button>
        <button data-opacity="50">50</button>
        <button data-opacity="25">25</button>
      </div>
      <div class="sep"></div>
      <button data-action="close"></button>
      <button data-action="close-all"></button>
    </div>
    <div id="pin-toast"></div>
    <script type="module" src="/src/pin.ts"></script>
  </body>
</html>
